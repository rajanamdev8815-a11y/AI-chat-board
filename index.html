<html lang="hi">
<head>6
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d18" />
  <title>Nova AI - Smart Chatbot</title>

  <style>
    :root {
      --bg: #090d18;
      --panel: #111827;
      --panel2: #172033;
      --border: rgba(255,255,255,.09);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --accent2: #06b6d4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #0c1220;
      border-right: 1px solid var(--border);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 5px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      display: grid;
      place-items: center;
      font-size: 22px;
      box-shadow: 0 5px 25px #8b5cf633;
    }

    .brand h2 {
      font-size: 20px;
      margin: 0;
      letter-spacing: -.5px;
    }

    .brand p {
      color: var(--muted);
      font-size: 11px;
      margin: 4px 0 0;
    }

    .new-chat, .side-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--panel);
      text-align: left;
      transition: .2s;
    }

    .new-chat:hover, .side-button:hover {
      border-color: var(--accent);
      background: #1b2440;
    }

    .section-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1.3px;
      margin: 0 8px 10px;
      text-transform: uppercase;
    }

    .history-item {
      padding: 11px;
      color: var(--muted);
      border-radius: 10px;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item.active {
      background: var(--panel2);
      color: var(--text);
    }

    .side-bottom {
      margin-top: auto;
      display: grid;
      gap: 10px;
    }

    .api-status {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 12px;
      padding: 13px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      margin-right: 6px;
    }

    /* Main */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .topbar {
      height: 76px;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(9,13,24,.88);
    }

    .topbar-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar h1 { font-size: 16px; margin: 0; }
    .topbar p { color: var(--muted); font-size: 12px; margin: 5px 0 0; }

    .model-select {
      max-width: 230px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 10px;
      outline: none;
    }

    .mobile-menu { display: none; }

    /* Chat */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 30px 20px;
    }

    .chat-content {
      width: 100%;
      max-width: 820px;
      margin: auto;
    }

    .welcome {
      text-align: center;
      padding: 8vh 10px 30px;
    }

    .welcome-logo {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      font-size: 36px;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      box-shadow: 0 10px 45px #8b5cf633;
    }

    .welcome h2 {
      font-size: clamp(25px, 4vw, 36px);
      margin: 0 0 12px;
      letter-spacing: -1px;
    }

    .gradient-text {
      background: linear-gradient(90deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome > p {
      max-width: 480px;
      margin: auto;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 600px;
      margin: 30px auto 0;
    }

    .suggestion {
      text-align: left;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      line-height: 1.5;
      transition: .2s;
    }

    .suggestion:hover {
      background: var(--panel2);
      border-color: #8b5cf6;
      transform: translateY(-2px);
    }

    .suggestion strong { display: block; margin-bottom: 5px; }
    .suggestion span { color: var(--muted); font-size: 12px; }

    .message {
      display: flex;
      gap: 13px;
      margin: 0 0 25px;
      align-items: flex-start;
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 35px;
      height: 35px;
      flex-shrink: 0;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 16px;
      background: var(--panel2);
      border: 1px solid var(--border);
    }

    .message.user .avatar {
      background: #39266c;
    }

    .message-body { min-width: 0; max-width: 85%; }

    .message-label {
      color: var(--muted);
      font-size: 11px;
      margin: 2px 0 8px;
    }

    .bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 5px 16px 16px 16px;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      background: #34245b;
      border-color: #6443a0;
      border-radius: 16px 5px 16px 16px;
    }

    .bubble pre {
      overflow-x: auto;
      padding: 13px;
      background: #080c14;
      border-radius: 9px;
      border: 1px solid var(--border);
    }

    .bubble code {
      font-family: Consolas, monospace;
      font-size: 13px;
    }

    .bubble p { margin: 0 0 10px; }
    .bubble p:last-child { margin-bottom: 0; }

    .typing {
      color: var(--muted);
      font-size: 13px;
      padding: 10px 0;
    }

    .typing::after {
      content: " ";
      display: inline-block;
      width: 5px;
      height: 5px;
      background: var(--accent2);
      border-radius: 50%;
      animation: pulse .8s infinite alternate;
    }

    @keyframes pulse {
      to { opacity: .2; transform: scale(.7); }
    }

    /* Composer */
    .composer-wrap {
      padding: 15px 20px 18px;
      border-top: 1px solid var(--border);
      background: #0b1020;
    }

    .composer {
      max-width: 820px;
      margin: auto;
      border: 1px solid #30394d;
      border-radius: 17px;
      background: #141b2b;
      padding: 12px;
      transition: border-color .2s;
    }

    .composer:focus-within { border-color: #8b5cf6; }

    #prompt {
      display: block;
      width: 100%;
      min-height: 48px;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 7px 5px;
      font-size: 14px;
      line-height: 1.6;
    }

    #prompt::placeholder { color: #718096; }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hint { font-size: 11px; color: var(--muted); }

    .send-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 20px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      box-shadow: 0 4px 15px #8b5cf633;
    }

    .send-button:hover { filter: brightness(1.15); }
    .send-button:disabled { opacity: .45; cursor: not-allowed; }

    .footer-note {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin: 10px 0 0;
    }

    /* API settings dialog */
    dialog {
      width: min(440px, calc(100% - 30px));
      color: var(--text);
      background: #111827;
      border: 1px solid #364155;
      border-radius: 18px;
      padding: 24px;
    }

    dialog::backdrop {
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(4px);
    }

    dialog h2 { font-size: 21px; margin-top: 0; }

    dialog p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .field-label {
      display: block;
      margin: 17px 0 8px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .field {
      width: 100%;
      background: #090d18;
      color: var(--text);
      border: 1px solid #364155;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    .field:focus { border-color: var(--accent); }

    .dialog-actions {
      display: flex;

        setStatus(true, "Connected · Groq API");
      } catch (error) {
        // Remove the unanswered user turn so context stays consistent.
        conversation.pop();

        const message = String(error.message || error);

        addMessage(

          "Sorry, something went wrong.\n\n" +
          "**Error:** " + message + "\n\n" +

        console.error("Groq API error:", error);
      } finally {

        promptEl.focus();

    }
  </script>
</body>
</html>
